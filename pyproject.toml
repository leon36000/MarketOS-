[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "marketos-foundation"
version = "0.1.0"
description = "Deterministic, non-live MARKET-OS foundation and paper-core"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
marketos = "marketos.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
