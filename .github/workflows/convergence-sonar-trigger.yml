name: convergence-sonar-trigger

on:
  push:
    branches:
      - chatgpt/integration-convergence-2026-08-26

permissions:
  contents: write

jobs:
  patch-verify-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: chatgpt/integration-convergence-2026-08-26
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Bind temporary-only delta
        run: |
          BASE=123c15e15e118b6c35aa1d6a0eff97c96b9830a2
          git merge-base --is-ancestor "$BASE" HEAD
          unexpected="$(git diff --name-only "$BASE"..HEAD | grep -Ev '^(.github/workflows/convergence-sonar-cleanup.yml|.github/workflows/convergence-sonar-trigger.yml|tools/convergence_sonar_cleanup.py|MANIFEST.json)$' || true)"
          test -z "$unexpected"
      - name: Apply exact cleanup
        run: python tools/convergence_sonar_cleanup.py
      - name: Focused integrity verification
        env:
          PYTHONPATH: src
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python -m unittest \
            tests.test_store \
            tests.test_store_integrity_concurrency \
            tests.test_store_schema_contract \
            tests.test_replay -v
      - name: Remove temporary machinery and reconcile authority
        run: |
          git rm \
            .github/workflows/convergence-sonar-cleanup.yml \
            .github/workflows/convergence-sonar-trigger.yml \
            tools/convergence_sonar_cleanup.py
          python tools/regenerate_derived.py --root . --json
      - name: Full repository verification
        env:
          PYTHONPATH: src
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python -m unittest discover -s tests -v
          python tools/verify_foundation.py --json
          python tools/validate_repository.py --root . --json
          python -m compileall -q src tools tests
          git diff --check
      - name: Publish verified cleanup
        run: |
          git config user.name "marketos-convergence-bot"
          git config user.email "marketos-convergence-bot@example.invalid"
          git add src/marketos/store.py tests/test_store.py MANIFEST.json
          git diff --cached --check
          git commit -m "refactor: close PR49 Sonar findings without semantic drift"
          git push origin HEAD:chatgpt/integration-convergence-2026-08-26
