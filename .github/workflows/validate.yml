name: validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  repository-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Derived files are reconciled
        run: python tools/regenerate_derived.py --root . --check --json
      - name: Unit tests
        env:
          PYTHONPATH: src
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m unittest discover -s tests -v
      - name: Foundation acceptance
        env:
          PYTHONPATH: src
          PYTHONDONTWRITEBYTECODE: "1"
        run: python tools/verify_foundation.py --json
      - name: C1 design contract
        run: python tools/validate_c1_design.py --root . --json
      - name: C2 design contract
        run: python tools/validate_c2_design.py --root . --json
      - name: C3 design contract
        run: |
          jq -e '.phase == "C3" and (.roles | length == 10) and .locks.storage_engine_selected == false and .locks.raw_overwrite == "FORBIDDEN" and ([.candidate_matrix[] | select(.status == "ADOPTED")] | length == 0) and (.recovery_rules | index("BACKUP_IS_NOT_VERIFIED_UNTIL_RESTORE") != null)' planning/phases/C3/C3_DECISIONS.json
          jq -e '([.requirements[].id] | sort) == (["AUD-CMP-013","AUD-DAT-004","AUD-DAT-012"] | sort) and .hard_boundary.clean_restore_executed == false' planning/phases/C3/C3_REQUIREMENT_CLOSURE.json
      - name: Repository contract
        run: python tools/validate_repository.py --root . --json
      - name: Compile Python sources
        run: python -m compileall -q src tools tests
