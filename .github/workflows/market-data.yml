name: market-data

on:
  push:
    paths:
      - "src/marketos/marketdata.py"
      - "src/marketos/bars.py"
      - "tests/test_marketdata.py"
      - "tests/test_bars.py"
      - "tests/test_marketdata_acceptance.py"
      - "tests/test_marketdata_authority.py"
      - "tools/verify_market_data.py"
      - "docs/implementation/CANONICAL_MARKET_DATA.md"
      - "docs/implementation/CANONICAL_MARKET_DATA_REVIEW.md"
      - ".github/workflows/market-data.yml"
  pull_request:
    paths:
      - "src/marketos/marketdata.py"
      - "src/marketos/bars.py"
      - "tests/test_marketdata.py"
      - "tests/test_bars.py"
      - "tests/test_marketdata_acceptance.py"
      - "tests/test_marketdata_authority.py"
      - "tools/verify_market_data.py"
      - "docs/implementation/CANONICAL_MARKET_DATA.md"
      - "docs/implementation/CANONICAL_MARKET_DATA_REVIEW.md"
      - ".github/workflows/market-data.yml"

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Canonical market-data tests
        env:
          PYTHONPATH: src
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python -m unittest \
            tests.test_marketdata \
            tests.test_bars \
            tests.test_marketdata_acceptance \
            tests.test_marketdata_authority -v
      - name: Independent market-data acceptance
        env:
          PYTHONPATH: src
          PYTHONDONTWRITEBYTECODE: "1"
        run: python tools/verify_market_data.py --json
      - name: Full repository verification
        env:
          PYTHONPATH: src
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python tools/regenerate_derived.py --root . --check --json
          python -m unittest discover -s tests -v
          python tools/verify_foundation.py --json
          python tools/verify_data_foundation.py --json
          python tools/verify_market_data.py --json
          python tools/validate_repository.py --root . --json
          python -m compileall -q src tools tests
