name: reconcile-derived-files

on:
  workflow_dispatch:
  push:
    branches:
      - "codex/**"
    paths:
      - ".github/workflows/reconcile-derived-files.yml"
      - ".github/workflows/validate.yml"
      - ".github/workflows/implementation-foundation.yml"
      - ".github/workflows/data-foundation.yml"
      - ".github/workflows/market-data.yml"
      - ".github/workflows/feature-foundation.yml"
      - "pyproject.toml"
      - "src/**"
      - "config/**"
      - "examples/**"
      - "requirements/REQUIREMENT_CROSSWALK.csv"
      - "requirements/README.md"
      - "execution-contracts/**"
      - "planning/phases/**"
      - "authority/**"
      - "docs/**"
      - "phases/**"
      - "research/**"
      - "amendments/**"
      - "tools/**"
      - "tests/**"

permissions:
  contents: write

concurrency:
  group: reconcile-derived-files-${{ github.ref }}
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Reconcile derived files
        run: python tools/regenerate_derived.py --root . --json
      - name: Verify reconciled branch
        env:
          PYTHONPATH: src
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python -m unittest discover -s tests -v
          python tools/verify_foundation.py --json
          python tools/verify_data_foundation.py --json
          python tools/verify_market_data.py --json
          python tools/verify_feature_foundation.py --json
          python tools/validate_c1_design.py --root . --json
          python tools/validate_c2_design.py --root . --json
          jq -e '.phase == "C3" and (.roles | length == 10) and .locks.storage_engine_selected == false and .locks.raw_overwrite == "FORBIDDEN" and ([.candidate_matrix[] | select(.status == "ADOPTED")] | length == 0) and (.recovery_rules | index("BACKUP_IS_NOT_VERIFIED_UNTIL_RESTORE") != null)' planning/phases/C3/C3_DECISIONS.json
          python tools/validate_repository.py --root . --json
          python -m compileall -q src tools tests
      - name: Commit reconciled files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "marketos-verifier[bot]"
          git config user.email "marketos-verifier[bot]@users.noreply.github.com"
          git add MANIFEST.json requirements/REQUIREMENTS_INDEX.json planning/PHASE_INDEX.json
          if git diff --cached --quiet; then
            echo "No derived-file changes required"
            exit 0
          fi
          git commit -m "chore: reconcile derived files"
          git push origin "HEAD:${{ github.ref_name }}"
