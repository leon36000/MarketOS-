name: reconcile-derived-files

on:
  workflow_dispatch:
  push:
    branches:
      - codex/c0-memory-c1-bootstrap
    paths:
      - ".github/workflows/reconcile-derived-files.yml"

permissions:
  contents: write

concurrency:
  group: reconcile-derived-files-${{ github.ref }}
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: codex/c0-memory-c1-bootstrap
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Reconcile requirement index and exact manifest
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib, json

          root = Path('.')
          csv_path = root / 'requirements' / 'REQUIREMENT_CROSSWALK.csv'
          index_path = root / 'requirements' / 'REQUIREMENTS_INDEX.json'
          phase_index_path = root / 'planning' / 'PHASE_INDEX.json'

          index = json.loads(index_path.read_text(encoding='utf-8'))
          index['source_csv_sha256'] = hashlib.sha256(csv_path.read_bytes()).hexdigest()
          index_path.write_text(json.dumps(index, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          formal_contracts = len(list((root / 'execution-contracts').glob('*.md')))
          formal_contracts += len(list((root / 'planning' / 'phases').glob('*/EXECUTION_CONTRACT.md')))
          phase_index = json.loads(phase_index_path.read_text(encoding='utf-8'))
          phase_index['formal_execution_contracts_present'] = formal_contracts
          phase_index_path.write_text(json.dumps(phase_index, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          ignored_dirs = {'.git', '.pytest_cache', '__pycache__', '.venv', 'htmlcov'}
          ignored_files = {'MANIFEST.json', '.coverage', 'coverage.xml', '.DS_Store'}
          entries = []
          for path in sorted(root.rglob('*')):
              if not path.is_file():
                  continue
              rel = path.relative_to(root)
              if path.name in ignored_files or path.suffix == '.pyc' or any(part in ignored_dirs for part in rel.parts):
                  continue
              content = path.read_bytes()
              entries.append({
                  'path': rel.as_posix(),
                  'sha256': hashlib.sha256(content).hexdigest(),
                  'bytes': len(content),
              })
          (root / 'MANIFEST.json').write_text(
              json.dumps({'version': '0.3.0', 'files': entries}, indent=2) + '\n',
              encoding='utf-8',
          )
          print({'manifest_files': len(entries), 'formal_contracts': formal_contracts})
          PY
      - name: Run repository contract tests
        run: |
          python -m unittest discover -s tests -v
          python tools/validate_repository.py --root . --json
          python -m compileall -q tools tests
      - name: Commit reconciled derived files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "marketos-verifier[bot]"
          git config user.email "marketos-verifier[bot]@users.noreply.github.com"
          git add MANIFEST.json requirements/REQUIREMENTS_INDEX.json planning/PHASE_INDEX.json
          if git diff --cached --quiet; then
            echo "No derived-file changes required"
            exit 0
          fi
          git commit -m "chore: reconcile requirement index and manifest"
          git push origin HEAD:codex/c0-memory-c1-bootstrap
