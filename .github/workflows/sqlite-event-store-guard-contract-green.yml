name: sqlite-event-store-guard-contract-green

on:
  push:
    branches:
      - "codex/sqlite-event-store-integrity"
    paths:
      - ".github/workflows/sqlite-event-store-guard-contract-green.yml"

permissions:
  contents: write

concurrency:
  group: sqlite-event-store-guard-contract-green-${{ github.ref }}
  cancel-in-progress: false

jobs:
  green:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Apply exact SQLite trigger contract verification
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("src/marketos/store.py")
          text = path.read_text(encoding="utf-8")
          old = "\n".join(
              [
                  '            normalized = self._normalize_sql(row["sql"])',
                  "            required = (",
                  '                f"BEFORE {operation} ON {table.upper()}",',
                  '                f"SELECT RAISE(ABORT, \'{message}\')",',
                  "            )",
                  '            if " WHEN " in f" {normalized} " or any(item not in normalized for item in required):',
                  '                raise InvariantViolation(f"EVENT_STORE_SCHEMA_INTEGRITY_FAILURE:{name}")',
              ]
          )
          new = "\n".join(
              [
                  '            normalized = self._normalize_sql(row["sql"])',
                  "            expected = self._normalize_sql(",
                  '                f"CREATE TRIGGER {name} "',
                  '                f"BEFORE {operation} ON {table} "',
                  '                f"BEGIN SELECT RAISE(ABORT, \'{message}\'); END"',
                  "            )",
                  "            if normalized != expected:",
                  '                raise InvariantViolation(f"EVENT_STORE_SCHEMA_INTEGRITY_FAILURE:{name}")',
              ]
          )
          if text.count(old) != 1:
              raise SystemExit("unexpected SQLite trigger verifier block")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
      - name: Focused RED to GREEN verification
        env:
          PYTHONPATH: src
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          python -m unittest \
            tests.test_store \
            tests.test_store_integrity_concurrency \
            tests.test_foundation_acceptance -v
      - name: Remove one-shot workflow and reconcile derived artifacts
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/sqlite-event-store-guard-contract-green.yml
          python tools/regenerate_derived.py --root . --json
      - name: Full repository verification
        env:
          PYTHONPATH: src
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -v
          python tools/verify_foundation.py --json
          python tools/verify_data_foundation.py --json
          python tools/verify_market_data.py --json
          python tools/verify_feature_foundation.py --json
          python tools/verify_research_governance.py --json
          python tools/verify_execution_calibration.py --json
          python tools/verify_architecture_reconciliation.py --root . --json
          python tools/verify_c13_contract.py --root . --json
          python tools/verify_c13_execution_safety.py --root . --json
          python tools/verify_c13_checkpoint_reconstruction.py --root . --json
          python tools/verify_proof_binding.py --root . --json
          python tools/verify_requirements_reconciliation.py --root . --json
          python tools/verify_proof_engine.py --root . --json
          python tools/validate_repository.py --root . --json
          python -m compileall -q src tools tests
          git diff --check
      - name: Commit exact verified tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "marketos-verifier[bot]"
          git config user.email "marketos-verifier[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: authenticate exact SQLite trigger contracts"
          git push origin "HEAD:${GITHUB_REF_NAME}"
