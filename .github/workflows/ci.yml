name: plan-quality
on:
  pull_request:
  push:
    branches: [main, "plan/**"]
permissions:
  contents: read
jobs:
  c1-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q
      - run: python tools/validate_c1.py .
      - run: ruff check .
