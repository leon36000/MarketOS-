name: architecture-reconciliation-red

on:
  pull_request:
    branches:
      - codex/execution-calibration-shadow-evidence
    paths:
      - "tests/test_architecture_reconciliation_acceptance.py"
      - ".github/workflows/architecture-reconciliation-red.yml"

permissions:
  contents: read

jobs:
  acceptance-red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Confirm reconciliation acceptance is RED before verifier exists
        shell: bash
        env:
          PYTHONPATH: src
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set +e
          python -m unittest tests.test_architecture_reconciliation_acceptance -v 2>&1 | tee /tmp/architecture-reconciliation-red.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -eq 0 ]; then
            echo "Expected RED acceptance test unexpectedly passed"
            exit 1
          fi
          grep -F "No module named 'tools.verify_architecture_reconciliation'" /tmp/architecture-reconciliation-red.log
          echo "Expected RED confirmed: reconciliation verifier is absent"
