name: repair-shadow-version-conflict-test

on:
  push:
    branches:
      - codex/execution-calibration-shadow-evidence
    paths:
      - ".github/workflows/repair-shadow-version-conflict-test.yml"

permissions:
  contents: write

concurrency:
  group: repair-shadow-version-conflict-test-${{ github.ref }}
  cancel-in-progress: false

jobs:
  repair-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Repair only the inconsistent conflict fixture
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("tests/test_shadow_evidence.py")
          text = path.read_text()
          old = 'replace(original, opportunity_fill_ratio=Decimal("0.50"))'
          new = 'replace(\n                    original,\n                    opportunity_fill_ratio=Decimal("0.50"),\n                    fill_ratio_gap=Decimal("-0.30"),\n                )'
          if text.count(old) != 1:
              raise SystemExit(f"expected exactly one conflict fixture, found {text.count(old)}")
          path.write_text(text.replace(old, new))
          PY
      - name: Verify root-cause repair and execution acceptance
        env:
          PYTHONPATH: src
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python -m unittest tests.test_shadow_evidence -v
          python tools/verify_execution_calibration.py --json
          git diff --check
      - name: Commit verified test repair and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/repair-shadow-version-conflict-test.yml
          git config user.name "marketos-verifier[bot]"
          git config user.email "marketos-verifier[bot]@users.noreply.github.com"
          git add tests/test_shadow_evidence.py .github/workflows/repair-shadow-version-conflict-test.yml
          git commit -m "test: keep shadow duplicate fixture internally consistent"
          git push origin "HEAD:${{ github.ref_name }}"
