name: materialize-feature-foundation-hardening

on:
  workflow_dispatch:
  push:
    branches:
      - codex/market-calendar-feature-store
    paths:
      - ".github/feature-foundation-hardening.py"
      - ".github/workflows/materialize-feature-foundation-hardening.yml"

permissions:
  contents: write

concurrency:
  group: materialize-feature-foundation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  red-patch-green:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Confirm adversarial feature tests are RED before patch
        shell: bash
        env:
          PYTHONPATH: src
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set +e
          python -m unittest tests.test_feature_foundation_adversarial -v
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "Expected RED feature tests unexpectedly passed"
            exit 1
          fi
          echo "RED confirmed with exit code $status"
      - name: Apply exact feature-foundation hardening
        run: python .github/feature-foundation-hardening.py
      - name: Remove helper but keep workflow outside bot-authored product commit
        run: |
          rm .github/feature-foundation-hardening.py
          git checkout -- .github/workflows/materialize-feature-foundation-hardening.yml
      - name: Focused GREEN verification
        env:
          PYTHONPATH: src
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python -m unittest \
            tests.test_sessions \
            tests.test_features \
            tests.test_feature_acceptance \
            tests.test_feature_foundation_adversarial -v
          python tools/verify_feature_foundation.py --json
          python -m compileall -q src tools tests
      - name: Reconcile and run broad verification
        env:
          PYTHONPATH: src
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python tools/regenerate_derived.py --root . --json
          python -m unittest discover -s tests -v
          python tools/verify_foundation.py --json
          python tools/verify_data_foundation.py --json
          python tools/verify_market_data.py --json
          python tools/verify_feature_foundation.py --json
          python tools/validate_repository.py --root . --json
          git diff --check
      - name: Commit verified hardening
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "marketos-implementation[bot]"
          git config user.email "marketos-implementation[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: preserve calendar lineage and exact feature authority"
          git push origin "HEAD:${{ github.ref_name }}"
