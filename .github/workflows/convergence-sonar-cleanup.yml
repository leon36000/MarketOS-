name: convergence-sonar-cleanup

on:
  push:
    branches:
      - chatgpt/integration-convergence-2026-08-26
    paths:
      - .github/workflows/convergence-sonar-cleanup.yml
  pull_request:
    types:
      - reopened

permissions:
  contents: write

jobs:
  patch-verify-and-self-remove:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Bind exact source tree
        run: |
          BASE=123c15e15e118b6c35aa1d6a0eff97c96b9830a2
          git merge-base --is-ancestor "$BASE" HEAD
          unexpected="$(git diff --name-only "$BASE"..HEAD | grep -v '^.github/workflows/convergence-sonar-cleanup.yml$' || true)"
          test -z "$unexpected"
      - name: Apply exact Sonar cleanup
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one match, got {count}")
              return text.replace(old, new, 1)

          store_path = Path("src/marketos/store.py")
          store = store_path.read_text(encoding="utf-8")
          store = replace_once(
              store,
              '''_BEGIN_IMMEDIATE = "BEGIN IMMEDIATE"
          _CANONICAL_TAGS = frozenset({"$decimal", "$datetime", "$path", "$uuid"})''',
              '''_BEGIN_IMMEDIATE = "BEGIN IMMEDIATE"
          _DECIMAL_TAG = "$decimal"
          _CANONICAL_TAGS = frozenset({_DECIMAL_TAG, "$datetime", "$path", "$uuid"})''',
              "decimal tag constant",
          )
          store = replace_once(
              store,
              '''        if set(value) == {"$decimal"}:
                      return Decimal(value["$decimal"])''',
              '''        if set(value) == {_DECIMAL_TAG}:
                      return Decimal(value[_DECIMAL_TAG])''',
              "decimal decode constant",
          )
          store = replace_once(
              store,
              '''def _reject_ambiguous_decimal_maps(value: Any) -> None:
              if isinstance(value, Mapping):
                  normalized_items = tuple((str(key), item) for key, item in value.items())
                  normalized_keys = tuple(key for key, _ in normalized_items)
                  normalized_key_set = set(normalized_keys)
                  if len(normalized_key_set) != len(normalized_keys):
                      raise InvariantViolation("NON_CANONICAL_PAYLOAD_KEYS")
                  if normalized_key_set == {"$decimal"}:
                      raise InvariantViolation("AMBIGUOUS_DECIMAL_MARKER")
                  if len(normalized_keys) == 1 and normalized_keys[0] in _CANONICAL_TAGS:
                      raise InvariantViolation(f"AMBIGUOUS_CANONICAL_TAG:{normalized_keys[0]}")
                  for _, item in normalized_items:
                      _reject_ambiguous_decimal_maps(item)
                  return
          ''',
              '''def _validated_mapping_values(value: Mapping[Any, Any]) -> tuple[Any, ...]:
              normalized_items = tuple((str(key), item) for key, item in value.items())
              normalized_keys = tuple(key for key, _ in normalized_items)
              if len(set(normalized_keys)) != len(normalized_keys):
                  raise InvariantViolation("NON_CANONICAL_PAYLOAD_KEYS")
              if normalized_keys == (_DECIMAL_TAG,):
                  raise InvariantViolation("AMBIGUOUS_DECIMAL_MARKER")
              if len(normalized_keys) == 1 and normalized_keys[0] in _CANONICAL_TAGS:
                  raise InvariantViolation(f"AMBIGUOUS_CANONICAL_TAG:{normalized_keys[0]}")
              return tuple(item for _, item in normalized_items)
          
          
          def _reject_ambiguous_decimal_maps(value: Any) -> None:
              if isinstance(value, Mapping):
                  for item in _validated_mapping_values(value):
                      _reject_ambiguous_decimal_maps(item)
                  return
          ''',
              "mapping validation refactor",
          )
          if store.count('"$decimal"') != 1:
              raise SystemExit("store.py must contain exactly one $decimal literal")
          store_path.write_text(store, encoding="utf-8")

          tests_path = Path("tests/test_store.py")
          tests = tests_path.read_text(encoding="utf-8")
          tests = replace_once(
              tests,
              '''                    with self.assertRaisesRegex(
                                  InvariantViolation,
                                  "AMBIGUOUS_DECIMAL_MARKER",
                              ):
                                  store.append(
                                      self.event(
                                          f"wrapped-event-{index}",
                                          payload={"wrapped": wrapper},
                                      )
                                  )''',
              '''                    event = self.event(
                                  f"wrapped-event-{index}",
                                  payload={"wrapped": wrapper},
                              )
                              with self.assertRaisesRegex(
                                  InvariantViolation,
                                  "AMBIGUOUS_DECIMAL_MARKER",
                              ):
                                  store.append(event)''',
              "wrapped event exception isolation",
          )
          tests = replace_once(
              tests,
              '''        with SQLiteEventStore(self.path) as store:
                      with self.assertRaisesRegex(InvariantViolation, "NON_CANONICAL_PAYLOAD_KEYS"):
                          store.append(
                              self.event(
                                  "normalized-key-event",
                                  payload={"wrapped": marker_mapping},
                              )
                          )''',
              '''        event = self.event(
                      "normalized-key-event",
                      payload={"wrapped": marker_mapping},
                  )
                  with SQLiteEventStore(self.path) as store:
                      with self.assertRaisesRegex(InvariantViolation, "NON_CANONICAL_PAYLOAD_KEYS"):
                          store.append(event)''',
              "normalized key exception isolation",
          )
          tests = replace_once(
              tests,
              '''                    with self.assertRaisesRegex(
                                  InvariantViolation,
                                  "NON_RECONSTRUCTIBLE_PAYLOAD_TYPE",
                              ):
                                  store.append(
                                      self.event(
                                          f"unsupported-event-{index}",
                                          payload={"value": value},
                                      )
                                  )''',
              '''                    event = self.event(
                                  f"unsupported-event-{index}",
                                  payload={"value": value},
                              )
                              with self.assertRaisesRegex(
                                  InvariantViolation,
                                  "NON_RECONSTRUCTIBLE_PAYLOAD_TYPE",
                              ):
                                  store.append(event)''',
              "unsupported event exception isolation",
          )
          tests = replace_once(
              tests,
              '''                    with self.assertRaisesRegex(
                                  InvariantViolation,
                                  "AMBIGUOUS_CANONICAL_TAG",
                              ):
                                  store.append(
                                      self.event(
                                          f"tagged-event-{index}",
                                          payload={"value": value},
                                      )
                                  )''',
              '''                    event = self.event(
                                  f"tagged-event-{index}",
                                  payload={"value": value},
                              )
                              with self.assertRaisesRegex(
                                  InvariantViolation,
                                  "AMBIGUOUS_CANONICAL_TAG",
                              ):
                                  store.append(event)''',
              "tagged event exception isolation",
          )
          tests_path.write_text(tests, encoding="utf-8")
          PY
      - name: Focused integrity verification
        env:
          PYTHONPATH: src
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python -m unittest \
            tests.test_store \
            tests.test_store_integrity_concurrency \
            tests.test_store_schema_contract \
            tests.test_replay -v
      - name: Remove one-shot workflow and reconcile authority
        run: |
          git rm .github/workflows/convergence-sonar-cleanup.yml
          python tools/regenerate_derived.py --root . --json
      - name: Full repository verification
        env:
          PYTHONPATH: src
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python -m unittest discover -s tests -v
          python tools/verify_foundation.py --json
          python tools/validate_repository.py --root . --json
          python -m compileall -q src tools tests
          git diff --check
      - name: Publish verified cleanup
        run: |
          git config user.name "marketos-convergence-bot"
          git config user.email "marketos-convergence-bot@example.invalid"
          git add src/marketos/store.py tests/test_store.py MANIFEST.json
          git diff --cached --check
          git commit -m "refactor: close PR49 Sonar findings without semantic drift"
          git push origin HEAD:chatgpt/integration-convergence-2026-08-26
