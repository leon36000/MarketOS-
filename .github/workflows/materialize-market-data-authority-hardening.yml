name: materialize-market-data-authority-hardening

on:
  workflow_dispatch:
  push:
    branches:
      - codex/canonical-market-data-quality
    paths:
      - ".github/market-data-authority-hardening.py"
      - ".github/workflows/materialize-market-data-authority-hardening.yml"

permissions:
  contents: write

concurrency:
  group: materialize-market-data-authority-${{ github.ref }}
  cancel-in-progress: false

jobs:
  red-patch-green:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Confirm authority tests are RED before patch
        shell: bash
        env:
          PYTHONPATH: src
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set +e
          python -m unittest tests.test_marketdata_authority -v
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "Expected RED authority tests unexpectedly passed"
            exit 1
          fi
          echo "RED confirmed with exit code $status"
      - name: Apply exact authority hardening
        run: python .github/market-data-authority-hardening.py
      - name: Remove helper but keep workflow outside bot-authored commit
        run: |
          rm .github/market-data-authority-hardening.py
          git checkout -- .github/workflows/materialize-market-data-authority-hardening.yml
      - name: Focused GREEN verification
        env:
          PYTHONPATH: src
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python -m unittest \
            tests.test_marketdata \
            tests.test_bars \
            tests.test_marketdata_acceptance \
            tests.test_marketdata_authority -v
          python tools/verify_market_data.py --json
          python -m compileall -q src tools tests
      - name: Reconcile and run broad verification
        env:
          PYTHONPATH: src
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python tools/regenerate_derived.py --root . --json
          python -m unittest discover -s tests -v
          python tools/verify_foundation.py --json
          python tools/verify_data_foundation.py --json
          python tools/verify_market_data.py --json
          python tools/validate_repository.py --root . --json
          git diff --check
      - name: Commit verified authority hardening
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "marketos-implementation[bot]"
          git config user.email "marketos-implementation[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: preserve market-data policy and derivation authority"
          git push origin "HEAD:${{ github.ref_name }}"
