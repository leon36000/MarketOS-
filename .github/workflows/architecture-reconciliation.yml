name: architecture-reconciliation

on:
  push:
    branches:
      - codex/pr14-pr20-reconciliation-proof
    paths:
      - ".github/workflows/architecture-reconciliation.yml"
      - "planning/architecture/PR14_PR20_RECONCILIATION.json"
      - "authority/CURRENT_STATE.json"
      - "tools/verify_architecture_reconciliation.py"
      - "tests/test_architecture_reconciliation_acceptance.py"
      - "docs/audit/PR14_PR20_RECONCILIATION.md"
  pull_request:
    branches:
      - codex/execution-calibration-shadow-evidence
    paths:
      - ".github/workflows/architecture-reconciliation.yml"
      - "planning/architecture/PR14_PR20_RECONCILIATION.json"
      - "authority/CURRENT_STATE.json"
      - "tools/verify_architecture_reconciliation.py"
      - "tests/test_architecture_reconciliation_acceptance.py"
      - "docs/audit/PR14_PR20_RECONCILIATION.md"

permissions:
  contents: read

jobs:
  acceptance-green:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Architecture reconciliation acceptance
        env:
          PYTHONPATH: src
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python -m unittest tests.test_architecture_reconciliation_acceptance -v
          python tools/verify_architecture_reconciliation.py --root . --json

  repository-green:
    needs: acceptance-green
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Derived files are reconciled
        run: python tools/regenerate_derived.py --root . --check --json
      - name: Full repository verification
        env:
          PYTHONPATH: src
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python -m unittest discover -s tests -v
          python tools/verify_foundation.py --json
          python tools/verify_data_foundation.py --json
          python tools/verify_market_data.py --json
          python tools/verify_feature_foundation.py --json
          python tools/verify_research_governance.py --json
          python tools/verify_execution_calibration.py --json
          python tools/verify_architecture_reconciliation.py --root . --json
          python tools/validate_c1_design.py --root . --json
          python tools/validate_c2_design.py --root . --json
          jq -e '.phase == "C3" and (.roles | length == 10) and .locks.storage_engine_selected == false and .locks.raw_overwrite == "FORBIDDEN" and ([.candidate_matrix[] | select(.status == "ADOPTED")] | length == 0) and (.recovery_rules | index("BACKUP_IS_NOT_VERIFIED_UNTIL_RESTORE") != null)' planning/phases/C3/C3_DECISIONS.json
          python tools/validate_repository.py --root . --json
          python -m compileall -q src tools tests
          git diff --check
