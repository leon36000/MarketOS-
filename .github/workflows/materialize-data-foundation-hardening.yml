name: materialize-data-foundation-hardening

on:
  workflow_dispatch:
  push:
    branches:
      - codex/security-master-data-fabric
    paths:
      - ".github/data-foundation-hardening.py"
      - ".github/workflows/materialize-data-foundation-hardening.yml"

permissions:
  contents: write

concurrency:
  group: materialize-data-foundation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  patch-verify-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Apply exact hardening patch
        run: python .github/data-foundation-hardening.py
      - name: Remove one-time materializer
        run: rm .github/data-foundation-hardening.py .github/workflows/materialize-data-foundation-hardening.yml
      - name: Focused GREEN verification
        env:
          PYTHONPATH: src
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python -m unittest \
            tests.test_identity \
            tests.test_corporate_actions \
            tests.test_rights \
            tests.test_datafabric \
            tests.test_data_foundation_adversarial \
            tests.test_data_foundation_acceptance -v
          python tools/verify_data_foundation.py --json
          python -m compileall -q src tools tests
      - name: Reconcile and run broad verification
        env:
          PYTHONPATH: src
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python tools/regenerate_derived.py --root . --json
          python -m unittest discover -s tests -v
          python tools/verify_foundation.py --json
          python tools/verify_data_foundation.py --json
          python tools/validate_repository.py --root . --json
          git diff --check
      - name: Commit verified hardening
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "marketos-implementation[bot]"
          git config user.email "marketos-implementation[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: harden temporal identity and dataset publication"
          git push origin "HEAD:${{ github.ref_name }}"
