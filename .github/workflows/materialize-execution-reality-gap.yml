name: materialize-execution-reality-gap

on:
  workflow_dispatch:
  push:
    branches:
      - codex/execution-calibration-shadow-evidence
    paths:
      - ".github/execution-reality-gap-hardening.py"
      - ".github/workflows/materialize-execution-reality-gap.yml"

permissions:
  contents: write

concurrency:
  group: materialize-execution-reality-gap-${{ github.ref }}
  cancel-in-progress: false

jobs:
  red-patch-green:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Confirm reality-gap tests are RED before implementation
        shell: bash
        env:
          PYTHONPATH: src
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set +e
          python -m unittest tests.test_execution_reality_gap -v
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "Expected RED reality-gap tests unexpectedly passed"
            exit 1
          fi
          echo "RED confirmed with exit code $status"
      - name: Apply exact reality-gap implementation
        run: python .github/execution-reality-gap-hardening.py
      - name: Remove helper but keep workflow outside bot-authored product commit
        run: |
          rm .github/execution-reality-gap-hardening.py
          git checkout -- .github/workflows/materialize-execution-reality-gap.yml
      - name: Focused GREEN verification
        env:
          PYTHONPATH: src
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python -m unittest \
            tests.test_execution_evidence \
            tests.test_execution_calibration \
            tests.test_execution_reality_gap -v
          python -m compileall -q src tools tests
      - name: Reconcile and run broad verification
        env:
          PYTHONPATH: src
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python tools/regenerate_derived.py --root . --json
          python -m unittest discover -s tests -v
          python tools/verify_foundation.py --json
          python tools/verify_data_foundation.py --json
          python tools/verify_market_data.py --json
          python tools/verify_feature_foundation.py --json
          python tools/verify_research_governance.py --json
          python tools/validate_repository.py --root . --json
          git diff --check
      - name: Commit verified reality-gap implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "marketos-implementation[bot]"
          git config user.email "marketos-implementation[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add contextual reality-gap and challenger gate"
          git push origin "HEAD:${{ github.ref_name }}"
