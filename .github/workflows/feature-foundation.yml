name: feature-foundation

on:
  push:
    paths:
      - "src/marketos/sessions.py"
      - "src/marketos/features.py"
      - "tests/test_sessions.py"
      - "tests/test_features.py"
      - "tests/test_feature_acceptance.py"
      - "tests/test_feature_foundation_adversarial.py"
      - "tools/verify_feature_foundation.py"
      - "docs/implementation/MARKET_CALENDAR_FEATURE_STORE.md"
      - "docs/implementation/MARKET_CALENDAR_FEATURE_STORE_REVIEW.md"
      - ".github/workflows/feature-foundation.yml"
  pull_request:
    paths:
      - "src/marketos/sessions.py"
      - "src/marketos/features.py"
      - "tests/test_sessions.py"
      - "tests/test_features.py"
      - "tests/test_feature_acceptance.py"
      - "tests/test_feature_foundation_adversarial.py"
      - "tools/verify_feature_foundation.py"
      - "docs/implementation/MARKET_CALENDAR_FEATURE_STORE.md"
      - "docs/implementation/MARKET_CALENDAR_FEATURE_STORE_REVIEW.md"
      - ".github/workflows/feature-foundation.yml"

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Session, feature and adversarial tests
        env:
          PYTHONPATH: src
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python -m unittest \
            tests.test_sessions \
            tests.test_features \
            tests.test_feature_acceptance \
            tests.test_feature_foundation_adversarial -v
      - name: Independent feature acceptance
        env:
          PYTHONPATH: src
          PYTHONDONTWRITEBYTECODE: "1"
        run: python tools/verify_feature_foundation.py --json
      - name: Full repository verification
        env:
          PYTHONPATH: src
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python tools/regenerate_derived.py --root . --check --json
          python -m unittest discover -s tests -v
          python tools/verify_foundation.py --json
          python tools/verify_data_foundation.py --json
          python tools/verify_market_data.py --json
          python tools/verify_feature_foundation.py --json
          python tools/validate_repository.py --root . --json
          python -m compileall -q src tools tests
