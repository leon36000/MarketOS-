name: c13-source-parent-sha-green

on:
  push:
    branches:
      - "codex/c13-source-parent-sha-validation"
    paths:
      - ".github/workflows/c13-source-parent-sha-green.yml"

permissions:
  contents: write

concurrency:
  group: c13-source-parent-sha-green-${{ github.ref }}
  cancel-in-progress: false

jobs:
  green:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Apply bounded security fix and refresh C13 receipt
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import importlib.util
          import json
          from pathlib import Path

          verifier_path = Path("tools/verify_c13_contract.py")
          text = verifier_path.read_text(encoding="utf-8")

          old_import = "import json\nfrom pathlib import Path"
          if text.count(old_import) != 1:
              raise SystemExit("unexpected verify_c13_contract import block")
          text = text.replace(old_import, "import json\nimport re\nfrom pathlib import Path", 1)

          marker = "\n\nC13_SOURCE_PATHS = (\n"
          if text.count(marker) != 1:
              raise SystemExit("unexpected C13_SOURCE_PATHS marker")
          helper = '''

_SHA1_RE = re.compile(r"[0-9a-f]{40}")


def _source_parent_is_ancestor(root: Path, value: object) -> bool:
    """Return whether an exact lowercase SHA-1 is reachable from ``HEAD``.

    The receipt value is never forwarded to a subprocess. Git produces the
    trusted ancestry set, and the untrusted receipt value is compared only
    after a strict allowlist check.
    """

    if not isinstance(value, str) or _SHA1_RE.fullmatch(value) is None:
        return False
    try:
        result = subprocess.run(
            ["git", "rev-list", "HEAD"],
            cwd=root,
            capture_output=True,
            text=True,
            check=False,
        )
    except OSError:
        return False
    if result.returncode != 0:
        return False
    return value in {line for line in result.stdout.splitlines() if line}
'''
          text = text.replace(marker, helper + "\nC13_SOURCE_PATHS = (\n", 1)

          old_paths = (
              '    "tests/test_c13_authoritative_books.py",\n'
              '    "tools/verify_c13_contract.py",'
          )
          new_paths = (
              '    "tests/test_c13_authoritative_books.py",\n'
              '    "tests/test_c13_source_parent_validation.py",\n'
              '    "tools/verify_c13_contract.py",'
          )
          if text.count(old_paths) != 1:
              raise SystemExit("unexpected C13 source-path block")
          text = text.replace(old_paths, new_paths, 1)

          old_block = '''    source_parent_commit = source_receipt.get("source_parent_commit")
    source_parent_valid = False
    if isinstance(source_parent_commit, str) and len(source_parent_commit) == 40:
        try:
            git_result = subprocess.run(
                ["git", "merge-base", "--is-ancestor", source_parent_commit, "HEAD"],
                cwd=root,
                capture_output=True,
                text=True,
                check=False,
            )
            source_parent_valid = git_result.returncode == 0
        except OSError:
            source_parent_valid = False
'''
          new_block = '''    source_parent_commit = source_receipt.get("source_parent_commit")
    source_parent_valid = _source_parent_is_ancestor(root, source_parent_commit)
'''
          if text.count(old_block) != 1:
              raise SystemExit("unexpected source-parent validation block")
          text = text.replace(old_block, new_block, 1)
          verifier_path.write_text(text, encoding="utf-8")

          spec = importlib.util.spec_from_file_location("verify_c13_contract_updated", verifier_path)
          if spec is None or spec.loader is None:
              raise SystemExit("cannot load updated C13 verifier")
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)

          receipt_path = Path("planning/phases/C13/C13_SOURCE_RECEIPT.json")
          receipt = json.loads(receipt_path.read_text(encoding="utf-8"))
          source_paths = list(module.C13_SOURCE_PATHS)
          source_hashes = {
              relative: hashlib.sha256(Path(relative).read_bytes()).hexdigest()
              for relative in source_paths
          }
          receipt["source_paths"] = source_paths
          receipt["source_sha256"] = source_hashes
          receipt["source_tree_sha256"] = module._source_tree_sha256(source_hashes)
          receipt_path.write_text(
              json.dumps(receipt, indent=2, ensure_ascii=False) + "\n",
              encoding="utf-8",
          )

          Path(".github/workflows/c13-source-parent-sha-green.yml").unlink()
          PY
      - name: Focused RED to GREEN verification
        env:
          PYTHONPATH: src
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python -m unittest tests.test_c13_source_parent_validation -v
          python tools/verify_c13_contract.py --root . --json
      - name: Reconcile derived artifacts
        run: python tools/regenerate_derived.py --root . --json
      - name: Full repository verification
        env:
          PYTHONPATH: src
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python -m unittest discover -s tests -v
          python tools/verify_foundation.py --json
          python tools/verify_data_foundation.py --json
          python tools/verify_market_data.py --json
          python tools/verify_feature_foundation.py --json
          python tools/verify_research_governance.py --json
          python tools/verify_execution_calibration.py --json
          python tools/verify_architecture_reconciliation.py --root . --json
          python tools/verify_c13_contract.py --root . --json
          python tools/verify_c13_execution_safety.py --root . --json
          python tools/verify_c13_checkpoint_reconstruction.py --root . --json
          python tools/verify_proof_binding.py --root . --json
          python tools/verify_requirements_reconciliation.py --root . --json
          python tools/verify_proof_engine.py --root . --json
          python tools/validate_repository.py --root . --json
          python -m compileall -q src tools tests
          git diff --check
      - name: Commit verified fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "marketos-verifier[bot]"
          git config user.email "marketos-verifier[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: validate C13 source parent revisions"
          git push origin "HEAD:${GITHUB_REF_NAME}"
