name: proof-engine-green

on:
  push:
    branches:
      - codex/proof-engine-v2-green
  pull_request:

permissions:
  contents: read

jobs:
  acceptance-green:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Proof Engine acceptance and adversarial tests
        env:
          PYTHONPATH: src
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python -m unittest tests.test_proof_engine tests.test_proof_engine_acceptance tests.test_proof_binding tests.test_requirements_reconciliation -v
          python tools/verify_proof_binding.py --json
          python tools/verify_requirements_reconciliation.py --json
          python tools/verify_proof_engine.py --json

  repository-green:
    needs: acceptance-green
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Full repository verification
        env:
          PYTHONPATH: src
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python tools/regenerate_derived.py --root . --check --json
          python -m unittest discover -s tests -v
          python tools/verify_foundation.py --json
          python tools/verify_data_foundation.py --json
          python tools/verify_market_data.py --json
          python tools/verify_feature_foundation.py --json
          python tools/verify_research_governance.py --json
          python tools/verify_execution_calibration.py --json
          python tools/verify_architecture_reconciliation.py --root . --json
          python tools/verify_requirements_reconciliation.py --json
          python tools/verify_proof_engine.py --json
          python tools/validate_repository.py --root . --json
          python -m compileall -q src tools tests
          git diff --check
