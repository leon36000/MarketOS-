name: sqlite-event-store-maintainability-green

on:
  push:
    branches:
      - "codex/sqlite-event-store-integrity"
    paths:
      - ".github/workflows/sqlite-event-store-maintainability-green.yml"

permissions:
  contents: write

concurrency:
  group: sqlite-event-store-maintainability-green-${{ github.ref }}
  cancel-in-progress: false

jobs:
  green:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Refactor store verification without changing the contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("src/marketos/store.py")
          text = path.read_text(encoding="utf-8")

          constant_marker = '_HEX64 = re.compile(r"[0-9a-f]{64}")\n'
          if text.count(constant_marker) != 1:
              raise SystemExit("unexpected SHA constant marker")
          text = text.replace(
              constant_marker,
              constant_marker + '_BEGIN_IMMEDIATE = "BEGIN IMMEDIATE"\n',
              1,
          )

          event_start = text.index("    @classmethod\n    def _verify_event_row(")
          event_end = text.index("    @classmethod\n    def verify_event_rows", event_start)
          event_block = "\n".join(
              [
                  "    @staticmethod",
                  "    def _validate_sha256(",
                  "        value: str,",
                  "        code: str,",
                  "        sequence: int,",
                  "        errors: list[str],",
                  "    ) -> None:",
                  "        if _HEX64.fullmatch(value) is None:",
                  '            errors.append(f"{code}:{sequence}")',
                  "",
                  "    @staticmethod",
                  "    def _decode_event_item(",
                  "        event_text: str,",
                  "        sequence: int,",
                  "        errors: list[str],",
                  "    ) -> tuple[EventEnvelope | None, str | None]:",
                  "        try:",
                  "            decoded = _decode(json.loads(event_text))",
                  "            event = _event_from_data(decoded)",
                  "            canonical_text = canonical_json(decoded)",
                  "            digest = event.sha256()",
                  "        except (",
                  "            AttributeError,",
                  "            DecimalException,",
                  "            InvariantViolation,",
                  "            KeyError,",
                  "            TypeError,",
                  "            ValueError,",
                  "        ):",
                  '            errors.append(f"EVENT_JSON_INVALID:{sequence}")',
                  "            return None, None",
                  "        if canonical_text != event_text:",
                  '            errors.append(f"EVENT_JSON_NON_CANONICAL:{sequence}")',
                  "        return event, digest",
                  "",
                  "    @classmethod",
                  "    def _verify_chain_link(",
                  "        cls,",
                  "        *,",
                  "        sequence: int,",
                  "        previous: str,",
                  "        item_sha256: str,",
                  "        stored_previous: str,",
                  "        stored_chain: str,",
                  "        errors: list[str],",
                  "    ) -> str:",
                  "        if stored_previous != previous:",
                  '            errors.append(f"PREVIOUS_CHAIN_MISMATCH:{sequence}")',
                  "        computed_chain = cls._chain_hash(sequence, previous, item_sha256)",
                  "        if stored_chain != computed_chain:",
                  '            errors.append(f"CHAIN_HASH_MISMATCH:{sequence}")',
                  "        return computed_chain",
                  "",
                  "    @classmethod",
                  "    def _verify_event_row(",
                  "        cls,",
                  "        row: sqlite3.Row,",
                  "        expected_sequence: int,",
                  "        previous: str,",
                  "    ) -> tuple[tuple[str, ...], str]:",
                  "        errors: list[str] = []",
                  "        sequence = cls._sequence(row, expected_sequence, errors)",
                  '        event_id = cls._text(row, "event_id", "EVENT_ID_INVALID", sequence, errors)',
                  '        event_text = cls._text(row, "event_json", "EVENT_JSON_INVALID", sequence, errors)',
                  '        stored_sha = cls._text(row, "event_sha256", "EVENT_SHA256_INVALID", sequence, errors)',
                  "        stored_previous = cls._text(",
                  "            row,",
                  '            "previous_chain_sha256",',
                  '            "PREVIOUS_CHAIN_INVALID",',
                  "            sequence,",
                  "            errors,",
                  "        )",
                  '        stored_chain = cls._text(row, "chain_sha256", "CHAIN_SHA256_INVALID", sequence, errors)',
                  '        cls._validate_sha256(stored_sha, "EVENT_SHA256_INVALID", sequence, errors)',
                  '        cls._validate_sha256(stored_previous, "PREVIOUS_CHAIN_INVALID", sequence, errors)',
                  '        cls._validate_sha256(stored_chain, "CHAIN_SHA256_INVALID", sequence, errors)',
                  "",
                  "        event, digest = cls._decode_event_item(event_text, sequence, errors)",
                  "        computed_item_sha = stored_sha if digest is None else digest",
                  "        if event is not None and event.event_id != event_id:",
                  '            errors.append(f"EVENT_ID_MISMATCH:{sequence}")',
                  "        if digest is not None and digest != stored_sha:",
                  '            errors.append(f"EVENT_HASH_MISMATCH:{sequence}")',
                  "        computed_chain = cls._verify_chain_link(",
                  "            sequence=sequence,",
                  "            previous=previous,",
                  "            item_sha256=computed_item_sha,",
                  "            stored_previous=stored_previous,",
                  "            stored_chain=stored_chain,",
                  "            errors=errors,",
                  "        )",
                  "        return tuple(dict.fromkeys(errors)), computed_chain",
                  "",
                  "",
              ]
          )
          text = text[:event_start] + event_block + text[event_end:]

          evidence_start = text.index("    @classmethod\n    def _verify_evidence_row(")
          evidence_end = text.index(
              "    @classmethod\n    def verify_evidence_rows",
              evidence_start,
          )
          evidence_block = "\n".join(
              [
                  "    @staticmethod",
                  "    def _decode_evidence_item(",
                  "        kind: str,",
                  "        payload_text: str,",
                  "        sequence: int,",
                  "        errors: list[str],",
                  "    ) -> str | None:",
                  "        try:",
                  "            payload = _decode(json.loads(payload_text))",
                  "            canonical_text = canonical_json(payload)",
                  '            digest = canonical_sha256({"kind": kind, "payload": payload})',
                  "        except (DecimalException, InvariantViolation, TypeError, ValueError):",
                  '            errors.append(f"EVIDENCE_JSON_INVALID:{sequence}")',
                  "            return None",
                  "        if canonical_text != payload_text:",
                  '            errors.append(f"EVIDENCE_JSON_NON_CANONICAL:{sequence}")',
                  "        return digest",
                  "",
                  "    @classmethod",
                  "    def _verify_evidence_row(",
                  "        cls,",
                  "        row: sqlite3.Row,",
                  "        expected_sequence: int,",
                  "        previous: str,",
                  "    ) -> tuple[tuple[str, ...], str]:",
                  "        errors: list[str] = []",
                  "        sequence = cls._sequence(row, expected_sequence, errors)",
                  '        kind = cls._text(row, "kind", "EVIDENCE_KIND_INVALID", sequence, errors)',
                  "        payload_text = cls._text(",
                  "            row,",
                  '            "payload_json",',
                  '            "EVIDENCE_JSON_INVALID",',
                  "            sequence,",
                  "            errors,",
                  "        )",
                  "        stored_sha = cls._text(",
                  "            row,",
                  '            "evidence_sha256",',
                  '            "EVIDENCE_SHA256_INVALID",',
                  "            sequence,",
                  "            errors,",
                  "        )",
                  "        stored_previous = cls._text(",
                  "            row,",
                  '            "previous_chain_sha256",',
                  '            "PREVIOUS_CHAIN_INVALID",',
                  "            sequence,",
                  "            errors,",
                  "        )",
                  '        stored_chain = cls._text(row, "chain_sha256", "CHAIN_SHA256_INVALID", sequence, errors)',
                  "        if not kind.strip():",
                  '            errors.append(f"EVIDENCE_KIND_INVALID:{sequence}")',
                  '        cls._validate_sha256(stored_sha, "EVIDENCE_SHA256_INVALID", sequence, errors)',
                  '        cls._validate_sha256(stored_previous, "PREVIOUS_CHAIN_INVALID", sequence, errors)',
                  '        cls._validate_sha256(stored_chain, "CHAIN_SHA256_INVALID", sequence, errors)',
                  "",
                  "        digest = cls._decode_evidence_item(kind, payload_text, sequence, errors)",
                  "        computed_item_sha = stored_sha if digest is None else digest",
                  "        if digest is not None and digest != stored_sha:",
                  '            errors.append(f"EVIDENCE_HASH_MISMATCH:{sequence}")',
                  "        computed_chain = cls._verify_chain_link(",
                  "            sequence=sequence,",
                  "            previous=previous,",
                  "            item_sha256=computed_item_sha,",
                  "            stored_previous=stored_previous,",
                  "            stored_chain=stored_chain,",
                  "            errors=errors,",
                  "        )",
                  "        return tuple(dict.fromkeys(errors)), computed_chain",
                  "",
                  "",
              ]
          )
          text = text[:evidence_start] + evidence_block + text[evidence_end:]

          begin_call = 'self._connection.execute("BEGIN IMMEDIATE")'
          if text.count(begin_call) != 4:
              raise SystemExit("unexpected BEGIN IMMEDIATE call count")
          text = text.replace(begin_call, "self._connection.execute(_BEGIN_IMMEDIATE)")
          path.write_text(text, encoding="utf-8")
          PY
      - name: Focused behavior verification
        env:
          PYTHONPATH: src
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          python -m unittest \
            tests.test_store \
            tests.test_store_integrity_concurrency \
            tests.test_foundation_acceptance -v
          python tools/verify_foundation.py --json
      - name: Remove one-shot workflow and reconcile derived artifacts
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/sqlite-event-store-maintainability-green.yml
          python tools/regenerate_derived.py --root . --json
      - name: Full repository verification
        env:
          PYTHONPATH: src
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -v
          python tools/verify_foundation.py --json
          python tools/verify_data_foundation.py --json
          python tools/verify_market_data.py --json
          python tools/verify_feature_foundation.py --json
          python tools/verify_research_governance.py --json
          python tools/verify_execution_calibration.py --json
          python tools/verify_architecture_reconciliation.py --root . --json
          python tools/verify_c13_contract.py --root . --json
          python tools/verify_c13_execution_safety.py --root . --json
          python tools/verify_c13_checkpoint_reconstruction.py --root . --json
          python tools/verify_proof_binding.py --root . --json
          python tools/verify_requirements_reconciliation.py --root . --json
          python tools/verify_proof_engine.py --root . --json
          python tools/validate_repository.py --root . --json
          python -m compileall -q src tools tests
          git diff --check
      - name: Commit exact verified tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "marketos-verifier[bot]"
          git config user.email "marketos-verifier[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "refactor: remove SQLite integrity maintenance debt"
          git push origin "HEAD:${GITHUB_REF_NAME}"
