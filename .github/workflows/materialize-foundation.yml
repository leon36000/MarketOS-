name: materialize-foundation

on:
  workflow_dispatch:
  push:
    branches:
      - codex/implementation-foundation-paper-core
    paths:
      - ".github/marketos-bootstrap/**"
      - ".github/workflows/materialize-foundation.yml"

permissions:
  contents: write

concurrency:
  group: materialize-foundation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Verify and extract implementation source
        shell: bash
        run: |
          set -euo pipefail
          cat .github/marketos-bootstrap/part-*.b64 | base64 --decode > /tmp/marketos-foundation.tar.gz
          echo "3ed9be2a1d506b1860715d82adf98dbcd2fc430e33dc13b3b160211a296e0a05  /tmp/marketos-foundation.tar.gz" | sha256sum --check --strict
          python - <<'PY'
          import tarfile
          from pathlib import PurePosixPath
          archive = "/tmp/marketos-foundation.tar.gz"
          with tarfile.open(archive, "r:gz") as handle:
              members = handle.getmembers()
              for member in members:
                  path = PurePosixPath(member.name)
                  if path.is_absolute() or ".." in path.parts or member.issym() or member.islnk():
                      raise SystemExit(f"unsafe archive member: {member.name}")
              handle.extractall(".", filter="data")
          PY
          rm -rf .github/marketos-bootstrap
          git checkout -- .github/workflows/validate.yml .github/workflows/reconcile-derived-files.yml
          rm -f .github/workflows/implementation-foundation.yml
      - name: Run focused implementation verification
        env:
          PYTHONPATH: src
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python -m unittest \
            tests.test_canonical \
            tests.test_cli \
            tests.test_events \
            tests.test_foundation_acceptance \
            tests.test_ledger \
            tests.test_money \
            tests.test_paper \
            tests.test_portfolio \
            tests.test_replay \
            tests.test_risk \
            tests.test_store -v
          python tools/verify_foundation.py --json
          python -m compileall -q src tools tests
          python -m marketos validate-config --risk config/paper-risk.json
          python -m marketos replay --input examples/paper_scenario.jsonl --risk config/paper-risk.json --initial-cash 1000.00 > /tmp/run-1.json
          python -m marketos replay --input examples/paper_scenario.jsonl --risk config/paper-risk.json --initial-cash 1000.00 > /tmp/run-2.json
          test "$(python -c 'import json; print(json.load(open("/tmp/run-1.json"))["fingerprint"])')" = "$(python -c 'import json; print(json.load(open("/tmp/run-2.json"))["fingerprint"])')"
      - name: Reconcile repository-derived files and run full suite
        env:
          PYTHONPATH: src
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python tools/regenerate_derived.py --root . --json
          python -m unittest discover -s tests -v
          python tools/verify_foundation.py --json
          python tools/validate_c1_design.py --root . --json
          python tools/validate_c2_design.py --root . --json
          jq -e '.phase == "C3" and (.roles | length == 10) and .locks.storage_engine_selected == false and .locks.raw_overwrite == "FORBIDDEN" and ([.candidate_matrix[] | select(.status == "ADOPTED")] | length == 0) and (.recovery_rules | index("BACKUP_IS_NOT_VERIFIED_UNTIL_RESTORE") != null)' planning/phases/C3/C3_DECISIONS.json
          python tools/validate_repository.py --root . --json
          python -m compileall -q src tools tests
      - name: Commit verified implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "marketos-implementation[bot]"
          git config user.email "marketos-implementation[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat: implement deterministic MARKET-OS paper-core foundation"
          git push origin "HEAD:${{ github.ref_name }}"
