name: implementation-foundation

on:
  push:
    paths:
      - "src/marketos/**"
      - "tests/**"
      - "tools/verify_foundation.py"
      - "config/**"
      - "examples/**"
      - "pyproject.toml"
      - ".github/workflows/implementation-foundation.yml"
  pull_request:
    paths:
      - "src/marketos/**"
      - "tests/**"
      - "tools/verify_foundation.py"
      - "config/**"
      - "examples/**"
      - "pyproject.toml"
      - ".github/workflows/implementation-foundation.yml"

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Unit and adversarial tests
        env:
          PYTHONPATH: src
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m unittest discover -s tests -v
      - name: Foundation acceptance
        env:
          PYTHONPATH: src
          PYTHONDONTWRITEBYTECODE: "1"
        run: python tools/verify_foundation.py --json
      - name: Compile
        run: python -m compileall -q src tools tests
      - name: Deterministic replay smoke
        env:
          PYTHONPATH: src
        run: |
          python -m marketos replay --input examples/paper_scenario.jsonl --risk config/paper-risk.json --initial-cash 1000.00 > /tmp/run-1.json
          python -m marketos replay --input examples/paper_scenario.jsonl --risk config/paper-risk.json --initial-cash 1000.00 > /tmp/run-2.json
          test "$(python -c 'import json; print(json.load(open("/tmp/run-1.json"))["fingerprint"])')" = "$(python -c 'import json; print(json.load(open("/tmp/run-2.json"))["fingerprint"])')"
