name: sqlite-event-store-schema-contract-green

on:
  push:
    branches:
      - "codex/sqlite-event-store-integrity"
    paths:
      - ".github/workflows/sqlite-event-store-schema-contract-green.yml"

permissions:
  contents: write

concurrency:
  group: sqlite-event-store-schema-contract-green-${{ github.ref }}
  cancel-in-progress: false

jobs:
  green:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Authenticate complete SQLite ledger schema contracts
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("src/marketos/store.py")
          text = path.read_text(encoding="utf-8")

          class_marker = """    _TRIGGER_CONTRACTS = {
              \"events_no_update\": (\"events\", \"UPDATE\", \"APPEND_ONLY_EVENTS\"),
              \"events_no_delete\": (\"events\", \"DELETE\", \"APPEND_ONLY_EVENTS\"),
              \"evidence_no_update\": (\"evidence\", \"UPDATE\", \"APPEND_ONLY_EVIDENCE\"),
              \"evidence_no_delete\": (\"evidence\", \"DELETE\", \"APPEND_ONLY_EVIDENCE\"),
          }
          """
          if text.count(class_marker) != 1:
              raise SystemExit("unexpected SQLite trigger contract block")
          table_contracts = """
              _TABLE_CONTRACTS = {
                  \"events\": \"\"\"
                      CREATE TABLE events (
                          sequence INTEGER PRIMARY KEY,
                          event_id TEXT NOT NULL UNIQUE,
                          event_sha256 TEXT NOT NULL,
                          previous_chain_sha256 TEXT NOT NULL,
                          chain_sha256 TEXT NOT NULL UNIQUE,
                          event_json TEXT NOT NULL
                      )
                  \"\"\",
                  \"evidence\": \"\"\"
                      CREATE TABLE evidence (
                          sequence INTEGER PRIMARY KEY,
                          kind TEXT NOT NULL,
                          evidence_sha256 TEXT NOT NULL,
                          previous_chain_sha256 TEXT NOT NULL,
                          chain_sha256 TEXT NOT NULL UNIQUE,
                          payload_json TEXT NOT NULL
                      )
                  \"\"\",
              }
          """
          text = text.replace(class_marker, class_marker + table_contracts, 1)

          method_start = text.index("    def _verify_schema_guards(self) -> None:\n")
          method_end = text.index("    def _verify_all_rows(\n", method_start)
          replacement = """    def _verify_table_contracts(self) -> None:
              names = tuple(self._TABLE_CONTRACTS)
              placeholders = ",".join("?" for _ in names)
              rows = self._connection.execute(
                  f"SELECT name, sql FROM sqlite_master "
                  f"WHERE type = 'table' AND name IN ({placeholders})",
                  names,
              ).fetchall()
              by_name = {str(row["name"]): row for row in rows}
              for name, expected_sql in self._TABLE_CONTRACTS.items():
                  row = by_name.get(name)
                  if row is None or self._normalize_sql(row["sql"]) != self._normalize_sql(expected_sql):
                      raise InvariantViolation(
                          f"EVENT_STORE_SCHEMA_INTEGRITY_FAILURE:{name}"
                      )

              def _protected_trigger_rows(self, catalog: str) -> tuple[sqlite3.Row, ...]:
                  if catalog not in {"sqlite_master", "sqlite_temp_master"}:
                      raise InvariantViolation("INVALID_SQLITE_SCHEMA_CATALOG")
                  tables = tuple(self._TABLE_CONTRACTS)
                  placeholders = ",".join("?" for _ in tables)
                  return tuple(
                      self._connection.execute(
                          f"SELECT name, tbl_name, sql FROM {catalog} "
                          f"WHERE type = 'trigger' AND tbl_name IN ({placeholders})",
                          tables,
                      ).fetchall()
                  )

              def _verify_trigger_contracts(self) -> None:
                  temporary_rows = self._protected_trigger_rows("sqlite_temp_master")
                  if temporary_rows:
                      unexpected = min(str(row["name"]) for row in temporary_rows)
                      raise InvariantViolation(
                          f"EVENT_STORE_SCHEMA_INTEGRITY_FAILURE:{unexpected}"
                      )
                  rows = self._protected_trigger_rows("sqlite_master")
                  by_name = {str(row["name"]): row for row in rows}
                  unexpected_names = sorted(set(by_name) - set(self._TRIGGER_CONTRACTS))
                  if unexpected_names:
                      raise InvariantViolation(
                          f"EVENT_STORE_SCHEMA_INTEGRITY_FAILURE:{unexpected_names[0]}"
                      )
                  for name, (table, operation, message) in self._TRIGGER_CONTRACTS.items():
                      row = by_name.get(name)
                      if row is None or str(row["tbl_name"]) != table:
                          raise InvariantViolation(
                              f"EVENT_STORE_SCHEMA_INTEGRITY_FAILURE:{name}"
                          )
                      normalized = self._normalize_sql(row["sql"])
                      expected = self._normalize_sql(
                          f"CREATE TRIGGER {name} "
                          f"BEFORE {operation} ON {table} "
                          f"BEGIN SELECT RAISE(ABORT, '{message}'); END"
                      )
                      if normalized != expected:
                          raise InvariantViolation(
                              f"EVENT_STORE_SCHEMA_INTEGRITY_FAILURE:{name}"
                          )

              def _verify_schema_contracts(self) -> None:
                  self._verify_table_contracts()
                  self._verify_trigger_contracts()

          """
          text = text[:method_start] + replacement + text[method_end:]
          call_count = text.count("self._verify_schema_guards()")
          if call_count != 3:
              raise SystemExit(f"unexpected schema guard call count: {call_count}")
          text = text.replace(
              "self._verify_schema_guards()",
              "self._verify_schema_contracts()",
          )
          path.write_text(text, encoding="utf-8")

          implementation = Path("docs/implementation/SQLITE_EVENT_STORE_INTEGRITY.md")
          implementation_text = implementation.read_text(encoding="utf-8")
          old = """A compatible database created by an older version receives these guards when reopened. The store then verifies their table, operation, unconditional execution and error message through `sqlite_master`; a trigger with the correct name but weakened semantics does not pass.
          """
          new = """A compatible database created by an older version receives these guards when reopened. The store authenticates the complete normalized `CREATE TABLE` contracts, including primary-key and uniqueness constraints, before accepting the database. It also requires the exact persistent trigger set, rejects every additional persistent or temporary trigger on the protected ledgers, and verifies each guard's table, operation, unconditional execution and error message. A trigger with the correct name but weakened semantics does not pass.
          """
          if implementation_text.count(old) != 1:
              raise SystemExit("unexpected implementation schema paragraph")
          implementation.write_text(
              implementation_text.replace(old, new, 1),
              encoding="utf-8",
          )

          design = Path("docs/superpowers/specs/2026-08-21-sqlite-event-store-integrity-design.md")
          design_text = design.read_text(encoding="utf-8")
          old = """Schema initialization uses `CREATE TRIGGER IF NOT EXISTS`, so an existing compatible database receives missing guards. Initialization then inspects `sqlite_master` and rejects a missing, conditional or semantically different guard as `EVENT_STORE_SCHEMA_INTEGRITY_FAILURE`.
          """
          new = """Schema initialization uses `CREATE TRIGGER IF NOT EXISTS`, so an existing compatible database receives missing guards. Initialization authenticates the normalized `CREATE TABLE` definitions, including primary-key and uniqueness constraints, requires exactly the four persistent guards, rejects every additional persistent or temporary trigger on the protected ledgers, and rejects a missing, conditional or semantically different contract as `EVENT_STORE_SCHEMA_INTEGRITY_FAILURE`.
          """
          if design_text.count(old) != 1:
              raise SystemExit("unexpected design schema paragraph")
          design.write_text(design_text.replace(old, new, 1), encoding="utf-8")
          PY
      - name: Focused RED to GREEN verification
        env:
          PYTHONPATH: src
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          python -m unittest \
            tests.test_store \
            tests.test_store_integrity_concurrency \
            tests.test_store_schema_contract \
            tests.test_foundation_acceptance -v
          python tools/verify_foundation.py --json
      - name: Remove one-shot workflow and reconcile derived artifacts
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/sqlite-event-store-schema-contract-green.yml
          python tools/regenerate_derived.py --root . --json
      - name: Full repository verification
        env:
          PYTHONPATH: src
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -v
          python tools/verify_foundation.py --json
          python tools/verify_data_foundation.py --json
          python tools/verify_market_data.py --json
          python tools/verify_feature_foundation.py --json
          python tools/verify_research_governance.py --json
          python tools/verify_execution_calibration.py --json
          python tools/verify_architecture_reconciliation.py --root . --json
          python tools/verify_c13_contract.py --root . --json
          python tools/verify_c13_execution_safety.py --root . --json
          python tools/verify_c13_checkpoint_reconstruction.py --root . --json
          python tools/verify_proof_binding.py --root . --json
          python tools/verify_requirements_reconciliation.py --root . --json
          python tools/verify_proof_engine.py --root . --json
          python tools/validate_repository.py --root . --json
          python -m compileall -q src tools tests
          git diff --check
      - name: Commit exact verified tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "marketos-verifier[bot]"
          git config user.email "marketos-verifier[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: authenticate complete SQLite ledger schema"
          git push origin "HEAD:${GITHUB_REF_NAME}"
